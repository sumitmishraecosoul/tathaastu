# Tathaastu production Nginx config for Vite SPA
# - Long cache for hashed assets
# - No-cache for index.html
# - SPA fallback routing
# - Gzip enabled
# - Brotli optional (commented unless module is installed)

server {
    listen 80;
    server_name _;

    # IMPORTANT:
    # Point this to your deployed dist directory on VPS
    root /var/www/tathaastu/dist;
    index index.html;

    # Security/basic hardening headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------- Compression --------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject
        application/font-woff
        application/font-woff2;

    # Optional Brotli (enable only if nginx has brotli module)
    # brotli on;
    # brotli_comp_level 5;
    # brotli_static on;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/xml
    #     text/javascript
    #     application/javascript
    #     application/json
    #     application/xml
    #     image/svg+xml;

    # -------- Caching strategy --------

    # 1) Hashed build assets: long immutable cache
    location ~* ^/assets/.*-[a-f0-9]{8}\.(?:js|css|mjs|png|jpe?g|webp|svg|gif|ico|woff2?|ttf|otf)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 2) Non-hashed static files: short cache
    location ~* \.(?:png|jpe?g|webp|svg|gif|ico|woff2?|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # 3) index.html must not be cached, so users pick up latest build map
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 4) SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

